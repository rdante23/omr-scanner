<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live 60-Item OMR Scanner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    .header {
      padding: 10px; background: #1e293b; text-align: center; border-bottom: 1px solid #334155;
    }
    h2 { margin: 0; font-size: 1.1rem; color: #34d399; }
    p { margin: 2px 0 0 0; font-size: 0.75rem; color: #94a3b8; }
    
    .scanner-container {
      position: relative; width: 100%; max-width: 500px; margin: 0 auto; flex: 1;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #000; overflow: hidden;
    }
    video { display: none; }
    canvas#viewCanvas {
      width: 100%; height: auto; display: block; max-height: 70vh; object-fit: contain;
    }
    
    .status-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      padding: 8px 12px; background: rgba(15, 23, 42, 0.88); border-radius: 6px;
      border: 1px solid #334155; font-size: 0.8rem; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }
    .pulse-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .pulse-dot.active { background: #10b981; }

    .live-grade-overlay {
      position: absolute; bottom: 20px; left: 15px; right: 15px;
      background: rgba(6, 78, 59, 0.95); color: #ffffff;
      padding: 16px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      border: 2px solid #34d399; display: none; z-index: 20; text-align: center;
    }
    .grade-score { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .grade-percent { font-size: 1rem; margin-top: 4px; font-weight: 600; color: #a7f3d0; }

    .controls-footer {
      padding: 12px; background: #1e293b; display: flex; gap: 8px; justify-content: center;
    }
    .btn {
      background: #10b981; color: white; border: none; padding: 10px 16px;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
    .btn:hover { background: #059669; }
    .btn-sec { background: #475569; }

    #keyPanel {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a;
      z-index: 100; display: none; flex-direction: column; padding: 16px;
    }
    .key-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; flex: 1; margin: 10px 0;
    }
    .key-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e293b; padding: 6px; border-radius: 4px; font-size: 0.8rem;
    }
    .key-btns button {
      width: 22px; height: 22px; border: 1px solid #64748b; background: #334155; color: #fff;
      border-radius: 3px; cursor: pointer; margin-left: 1px; font-size: 0.75rem;
    }
    .key-btns button.active { background: #10b981; border-color: #10b981; }

    #hiddenWarpedCanvas { display: none; }
  </style>

  <script async src="https://unpkg.com/opencv.js@4.5.5/opencv.js" onload="onOpenCvLoaded()"></script>
</head>
<body>

  <div class="header">
    <h2>60-Item Live OMR Scanner</h2>
    <p>Hold sheet flat. Green squares = detected markers.</p>
  </div>

  <div class="scanner-container">
    <div class="status-overlay">
      <div>
        <span class="pulse-dot" id="stateDot"></span>
        <span id="stateText">Loading OpenCV...</span>
      </div>
      <button class="btn btn-sec" style="padding: 4px 8px; font-size:0.75rem;" id="toggleCameraBtn">Flip Cam</button>
    </div>

    <div class="live-grade-overlay" id="gradeOverlay">
      <div class="grade-score" id="gradeScoreText">-- / 60</div>
      <div class="grade-percent" id="gradePercentText">--%</div>
      <button class="btn" style="margin-top: 10px; background: #047857;" onclick="dismissResult()">Scan Next Sheet</button>
    </div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="viewCanvas"></canvas>
    <canvas id="hiddenWarpedCanvas" width="520" height="740"></canvas>
  </div>

  <div class="controls-footer">
    <button class="btn" id="manualSnapBtn">Force Scan Frame</button>
    <button class="btn btn-sec" id="openKeyBtn">Answer Key</button>
  </div>

  <!-- Key Setup Drawer -->
  <div id="keyPanel">
    <h3 style="margin:0 0 8px 0;">Teacher Answer Key (60 Items)</h3>
    <input type="text" id="quickKeyInput" placeholder="Quick paste 60 letters (e.g. ABCDE...)" style="width:100%; padding:8px; border-radius:4px; border:1px solid #475569; background:#1e293b; color:white; box-sizing: border-box;">
    <button class="btn" style="margin-top:6px;" onclick="applyQuickKey()">Apply Key</button>
    <div class="key-grid" id="keyGrid"></div>
    <button class="btn" style="width:100%;" id="closeKeyBtn">Done</button>
  </div>

<script>
let video = document.getElementById('videoElement');
let canvasEl = document.getElementById('viewCanvas');
let ctx = canvasEl.getContext('2d');
let tempCanvas = document.getElementById('hiddenWarpedCanvas');
let tempCtx = tempCanvas.getContext('2d');

let openCvReady = false;
let currentFacingMode = "environment";
let isScanningActive = true;

// Internal fixed work buffer for OpenCV (640x480)
const PROC_W = 640;
const PROC_H = 480;
let procCanvas = document.createElement('canvas');
procCanvas.width = PROC_W;
procCanvas.height = PROC_H;
let procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

// 60-Item Coordinate System
const TOTAL_QUESTIONS = 60;
const OPTIONS = ['A', 'B', 'C', 'D', 'E'];
const ITEMS_PER_COL = 15;
const COL_X = [20, 145, 270, 395];
const TOP_Y = 96;
const HEADER_H = 24;
const ROW_H = 35;
const OPT_OFFSET_X = 20;
const OPT_STEP_X = 16;
const BOX_CENTER_Y_OFFSET = 17;

const BUBBLE_COORDINATES = {};
for (let q = 1; q <= TOTAL_QUESTIONS; q++) {
  const colIndex = Math.floor((q - 1) / ITEMS_PER_COL);
  const rowIndex = (q - 1) % ITEMS_PER_COL;
  const baseColX = COL_X[colIndex];
  const centerY = TOP_Y + HEADER_H + (rowIndex * ROW_H) + BOX_CENTER_Y_OFFSET;

  BUBBLE_COORDINATES[q] = { centerY: centerY, options: {} };
  OPTIONS.forEach((opt, idx) => {
    BUBBLE_COORDINATES[q].options[opt] = baseColX + OPT_OFFSET_X + (idx * OPT_STEP_X) + 6.5; 
  });
}

let ANSWER_KEY = JSON.parse(localStorage.getItem('omr_key_60') || '{}');
if (Object.keys(ANSWER_KEY).length === 0) {
  for (let i = 1; i <= TOTAL_QUESTIONS; i++) ANSWER_KEY[i] = OPTIONS[(i - 1) % 5];
}

function onOpenCvLoaded() {
  openCvReady = true;
  document.getElementById('stateText').textContent = "Starting Camera...";
  startCamera();
}

async function startCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = stream;
    video.play();
    video.onloadedmetadata = () => {
      canvasEl.width = video.videoWidth;
      canvasEl.height = video.videoHeight;
      document.getElementById('stateDot').classList.add('active');
      document.getElementById('stateText').textContent = "Scanning Active";
      requestAnimationFrame(renderLoop);
    };
  } catch (err) {
    document.getElementById('stateText').textContent = "Camera Error: " + err.message;
  }
}

// Main Scan Loop
function renderLoop() {
  if (!video.videoWidth) return;

  // Render raw feed to visible canvas
  ctx.drawImage(video, 0, 0, canvasEl.width, canvasEl.height);

  if (openCvReady && isScanningActive) {
    // Render downscaled image for fast, predictable CV processing
    procCtx.drawImage(video, 0, 0, PROC_W, PROC_H);
    detectAndProcessSheet();
  }

  requestAnimationFrame(renderLoop);
}

function detectAndProcessSheet() {
  try {
    let src = cv.imread(procCanvas);
    let gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    let thresh = new cv.Mat();
    // Strong binary threshold to isolate black markers from white paper
    cv.threshold(gray, thresh, 80, 255, cv.THRESH_BINARY_INV);

    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let scaleX = canvasEl.width / PROC_W;
    let scaleY = canvasEl.height / PROC_H;
    let markers = [];

    for (let i = 0; i < contours.size(); ++i) {
      let cnt = contours.get(i);
      let rect = cv.boundingRect(cnt);
      let area = rect.width * rect.height;
      let ratio = rect.width / rect.height;

      // In a 640x480 frame, the 28-40px marker will have an area between 120 and 4500
      if (area > 120 && area < 4500 && ratio > 0.65 && ratio < 1.45) {
        let extent = cv.contourArea(cnt) / area;
        if (extent > 0.65) { // Marker should be predominantly solid
          markers.push({
            x: (rect.x + rect.width / 2) * scaleX,
            y: (rect.y + rect.height / 2) * scaleY,
            w: rect.width * scaleX,
            h: rect.height * scaleY
          });

          // Draw real-time green box on the live camera screen over recognized markers
          ctx.strokeStyle = "#10b981";
          ctx.lineWidth = 3;
          ctx.strokeRect(rect.x * scaleX, rect.y * scaleY, rect.width * scaleX, rect.height * scaleY);
        }
      }
      cnt.delete();
    }

    document.getElementById('stateText').textContent = `Markers found: ${markers.length}/4`;

    if (markers.length >= 4) {
      let corners = sortCorners(markers);
      if (corners) {
        // Draw sheet boundary
        ctx.strokeStyle = "#34d399";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(corners.tl.x, corners.tl.y);
        ctx.lineTo(corners.tr.x, corners.tr.y);
        ctx.lineTo(corners.br.x, corners.br.y);
        ctx.lineTo(corners.bl.x, corners.bl.y);
        ctx.closePath();
        ctx.stroke();

        warpAndScore(src, corners);
      }
    }

    src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
  } catch (err) {
    console.error(err);
  }
}

function sortCorners(pts) {
  if (pts.length < 4) return null;

  // Filter out any duplicates that are too close together
  let cleaned = [];
  for (let p of pts) {
    if (!cleaned.some(c => Math.hypot(p.x - c.x, p.y - c.y) < 40)) {
      cleaned.push(p);
    }
  }
  if (cleaned.length < 4) return null;

  // Sort by top-left, top-right, bottom-right, bottom-left
  cleaned.sort((a, b) => a.y - b.y);
  let topTwo = [cleaned[0], cleaned[1]].sort((a, b) => a.x - b.x);
  let bottomTwo = [cleaned[cleaned.length - 2], cleaned[cleaned.length - 1]].sort((a, b) => a.x - b.x);

  let tl = topTwo[0];
  let tr = topTwo[1];
  let bl = bottomTwo[0];
  let br = bottomTwo[1];

  // Geometric validity checks
  if (Math.abs(tl.x - tr.x) < 100 || Math.abs(bl.x - br.x) < 100) return null;
  if (Math.abs(tl.y - bl.y) < 120 || Math.abs(tr.y - br.y) < 120) return null;

  return { tl, tr, br, bl };
}

function warpAndScore(srcMat, corners) {
  let scaleX = PROC_W / canvasEl.width;
  let scaleY = PROC_H / canvasEl.height;

  let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
    corners.tl.x * scaleX, corners.tl.y * scaleY,
    corners.tr.x * scaleX, corners.tr.y * scaleY,
    corners.br.x * scaleX, corners.br.y * scaleY,
    corners.bl.x * scaleX, corners.bl.y * scaleY
  ]);

  let destCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
    12, 12,
    494, 12,
    494, 714,
    12, 714
  ]);

  let dsize = new cv.Size(tempCanvas.width, tempCanvas.height);
  let warped = new cv.Mat();
  let M = cv.getPerspectiveTransform(srcCoords, destCoords);
  cv.warpPerspective(srcMat, warped, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

  cv.imshow('hiddenWarpedCanvas', warped);
  evaluateGrading();

  warped.delete(); srcCoords.delete(); destCoords.delete(); M.delete();
}

function evaluateGrading() {
  let score = 0;
  for (let q = 1; q <= TOTAL_QUESTIONS; q++) {
    const item = BUBBLE_COORDINATES[q];
    let densities = [];

    OPTIONS.forEach(opt => {
      let cx = item.options[opt];
      let cy = item.centerY;
      let d = getSampleDarkness(cx, cy);
      densities.push({ opt, d });
    });

    densities.sort((a, b) => b.d - a.d);

    let chosen = null;
    // Mark must be darker than threshold and notably darker than neighboring options
    if (densities[0].d > 70 && (densities[0].d - densities[1].d) >= 22) {
      chosen = densities[0].opt;
    }

    if (chosen === ANSWER_KEY[q]) score++;
  }

  // Display results
  isScanningActive = false; // Pause scanner to prevent flicker once graded
  let pct = ((score / TOTAL_QUESTIONS) * 100).toFixed(0);
  document.getElementById('gradeScoreText').textContent = `${score} / ${TOTAL_QUESTIONS}`;
  document.getElementById('gradePercentText').textContent = `${pct}% ${pct >= 50 ? '🎉 Passed' : '❌ Failed'}`;
  document.getElementById('gradeOverlay').style.display = 'block';
}

function getSampleDarkness(cx, cy) {
  let imgData = tempCtx.getImageData(cx - 3, cy - 3, 6, 6).data;
  let dark = 0;
  for (let i = 0; i < imgData.length; i += 4) {
    dark += (255 - imgData[i]); // Red-channel green-dropout
  }
  return dark / (imgData.length / 4);
}

function dismissResult() {
  document.getElementById('gradeOverlay').style.display = 'none';
  isScanningActive = true;
}

// Manual force scan button (takes the active view and evaluates directly)
document.getElementById('manualSnapBtn').addEventListener('click', () => {
  tempCtx.drawImage(canvasEl, 0, 0, tempCanvas.width, tempCanvas.height);
  evaluateGrading();
});

// UI Event Handlers
document.getElementById('toggleCameraBtn').addEventListener('click', () => {
  currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
  startCamera();
});

function buildKeyGrid() {
  const grid = document.getElementById('keyGrid');
  grid.innerHTML = '';
  for (let q = 1; q <= TOTAL_QUESTIONS; q++) {
    const row = document.createElement('div');
    row.className = 'key-row';
    let btns = `<div class="key-btns" data-q="${q}">`;
    OPTIONS.forEach(opt => {
      const active = (ANSWER_KEY[q] === opt) ? 'active' : '';
      btns += `<button class="${active}" onclick="updateKey(${q}, '${opt}')">${opt}</button>`;
    });
    btns += `</div>`;
    row.innerHTML = `<span><b>${q}.</b></span> ${btns}`;
    grid.appendChild(row);
  }
}

function updateKey(q, opt) {
  ANSWER_KEY[q] = opt;
  localStorage.setItem('omr_key_60', JSON.stringify(ANSWER_KEY));
  const el = document.querySelector(`.key-btns[data-q="${q}"]`);
  el.querySelectorAll('button').forEach(btn => btn.classList.toggle('active', btn.textContent === opt));
}

function applyQuickKey() {
  const input = document.getElementById('quickKeyInput').value.trim().toUpperCase();
  if (input.length !== 60) {
    alert("Please enter exactly 60 characters (A-E).");
    return;
  }
  for (let i = 0; i < 60; i++) {
    if (OPTIONS.includes(input[i])) ANSWER_KEY[i+1] = input[i];
  }
  localStorage.setItem('omr_key_60', JSON.stringify(ANSWER_KEY));
  buildKeyGrid();
  alert("Answer key saved!");
}

document.getElementById('openKeyBtn').addEventListener('click', () => {
  document.getElementById('keyPanel').style.display = 'flex';
  buildKeyGrid();
});
document.getElementById('closeKeyBtn').addEventListener('click', () => {
  document.getElementById('keyPanel').style.display = 'none';
});
</script>

</body>
</html>
